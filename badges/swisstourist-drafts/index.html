<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>swisstourist - badge drafts</title>
<style>
:root{--bg:#070c12;--line:#1d2b39;--ink:#d3e7f2;--dim:#7f97a8;--accent:#3fd8ff}
*{box-sizing:border-box}
body{margin:0;padding:28px;color:var(--ink);font:14px/1.6 ui-monospace,Menlo,monospace;
 background:radial-gradient(1100px 650px at 10% -10%,rgba(74,31,122,.45),transparent 60%),
 radial-gradient(900px 600px at 95% 6%,rgba(26,92,134,.4),transparent 60%),var(--bg)}
h1{font-size:15px;font-weight:400;letter-spacing:.2em;color:var(--accent);margin:0 0 4px}
p.note{color:var(--dim);margin:0 0 22px;max-width:70ch}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
figure{margin:0;padding:18px;border:1px solid var(--line);border-radius:10px;
 background:linear-gradient(180deg,rgba(20,32,45,.8),rgba(12,20,29,.8));text-align:center}
figure img{width:280px;height:280px}
figcaption{margin-top:12px;color:var(--accent);letter-spacing:.12em;font-size:13px}
.line{color:var(--dim);font-size:12px;margin-top:4px}
.pair{display:flex;gap:0;margin-top:14px;border-radius:6px;overflow:hidden}
.pair div{flex:1;padding:10px 0;font-size:11px;color:var(--dim)}
.on-dark{background:#0b131c}.on-light{background:#ececec;color:#333}
.pair img{width:74px;height:74px;display:block;margin:0 auto 6px}
</style></head><body>
<h1>SWISSTOURIST // BADGE DRAFTS</h1>
<p class="note">Five ideas, all from things he said in chat tonight. Each shown big,
then small on dark and on light - a badge has to survive both, and the second row is
where a bad edge shows up.</p>
<div class="grid">
<figure>
  <img src="1-supervisor.png" alt="CLAUDE'S SUPERVISOR">
  <figcaption>CLAUDE'S SUPERVISOR</figcaption>
  <div class="line">his own line - runs Codex over Claude since March</div>
  <div class="pair">
    <div class="on-dark"><img src="1-supervisor.png" alt="">on dark</div>
    <div class="on-light"><img src="1-supervisor.png" alt="">on light</div>
  </div>
</figure>
<figure>
  <img src="2-tourist.png" alt="THE TOURIST">
  <figcaption>THE TOURIST</figcaption>
  <div class="line">why he picked the name: never the expected path</div>
  <div class="pair">
    <div class="on-dark"><img src="2-tourist.png" alt="">on dark</div>
    <div class="on-light"><img src="2-tourist.png" alt="">on light</div>
  </div>
</figure>
<figure>
  <img src="3-king.png" alt="CODEX - KING OF AI">
  <figcaption>CODEX - KING OF AI</figcaption>
  <div class="line">he declared it in chat, letter by letter</div>
  <div class="pair">
    <div class="on-dark"><img src="3-king.png" alt="">on dark</div>
    <div class="on-light"><img src="3-king.png" alt="">on light</div>
  </div>
</figure>
<figure>
  <img src="4-yolo.png" alt="--yolo">
  <figcaption>--yolo</figcaption>
  <div class="line">the flag he taught you, at start or not at all</div>
  <div class="pair">
    <div class="on-dark"><img src="4-yolo.png" alt="">on dark</div>
    <div class="on-light"><img src="4-yolo.png" alt="">on light</div>
  </div>
</figure>
<figure>
  <img src="5-save.png" alt="THE EMAIL SAVE">
  <figcaption>THE EMAIL SAVE</figcaption>
  <div class="line">caught /status before it printed on stream</div>
  <div class="pair">
    <div class="on-dark"><img src="5-save.png" alt="">on dark</div>
    <div class="on-light"><img src="5-save.png" alt="">on light</div>
  </div>
</figure>
</div></body></html>
